[project]
name = "barra2-dl"
version = "0.3.0"
description = "A tool for downloading BARRA version 2 (BARRA2) atmospheric reanalysis data."
authors = [{ name = "akarich73", email = "rich_gledhill@hotmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "CC-BY-4.0"
keywords = [
    "downloader",
    "barra2",
    "atmospheric",
    "reanlysis",
    "wind",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: Creative Commons Attribution 4.0 International",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2.3,<3",
    "requests>=2.32.3,<3",
    "numpy>=2.1.2,<3",
    "ipykernel>=7.3.0,<8",
    "pandas-stubs~=2.3.3",
]

[project.urls]
Repository = "https://github.com/richard-gledhill/barra2-dl"

[dependency-groups]
dev = [
    "deptry>=0.23,<1",
    "mypy>=1.8,<3.0",
    "pre-commit>=4.5,<5",
    "pytest>=8,<10",
    "pytest-cov>=4.1,<8.0",
    "pytest-randomly>=3.15,<4",
    "ruff>=0.9.10,<0.17.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings[python]>=1.0,<2",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.deptry.per_rule_ignores]
# ipykernel: used by scripts/example_barra2_dl.ipynb, outside deptry's src/ scan.
# pandas-stubs: a type-stub-only package consumed by mypy, never imported directly.
DEP002 = ["ipykernel", "pandas-stubs"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
norecursedirs = ["*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]
xfail_strict = true
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--doctest-modules",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "docs",
    "scripts",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 120

[tool.ruff.format]
exclude = ["*.ipynb"]
quote-style = "single"  # matches the codebase's existing convention

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # PEP8 naming conventions
    "PGH",  # pygrep-hooks
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T10",  # flake8-debugger
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "YTT",  # flake8-2020
]
ignore = [
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "D106",  # missing docstring in public nested class
    "D401",  # imperative mood
    "W191",  # indentation contains tabs
    # TRY003/TRY004 would require a custom exception hierarchy (or changing
    # raised exception types, which breaks existing `pytest.raises(ValueError)`
    # assertions and any downstream callers) - out of scope for a lint-tool swap.
    "TRY003",
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow `assert` in tests

[tool.ruff.lint.pydocstyle]
convention = "google"
