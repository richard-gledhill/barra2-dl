[project]
name = "barra2-dl"
version = "0.3.0"
description = "A tool for downloading BARRA version 2 (BARRA2) atmospheric reanalysis data."
authors = [{ name = "akarich73", email = "rich_gledhill@hotmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "CC-BY-4.0"
keywords = [
    "downloader",
    "barra2",
    "atmospheric",
    "reanlysis",
    "wind",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: Creative Commons Attribution 4.0 International",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2.3,<3",
    "requests>=2.32.3,<3",
    "numpy>=2.1.2,<3",
    "ipykernel>=7.3.0,<8",
    "pandas-stubs~=2.3.3",
]

[project.urls]
Repository = "https://github.com/akarich73/barra2-dl"

[dependency-groups]
dev = [
    "mypy>=1.8,<3.0",
    "wemake-python-styleguide>=0.18,<1.9",
    "flake8-pytest-style>=1.6,<2",
    "nitpick>=0.34,<0.39",
    "pytest>=8,<10",
    "pytest-cov>=4.1,<8.0",
    "pytest-randomly>=3.15,<4",
    "ruff>=0.9.10,<0.17.0",
]
docs = [
    "sphinx>=7.1,<8",
    "sphinx-autodoc-typehints>=1.25,<2",
    "m2r2>=0.3,<0.4",
    "tomli>=2.0,<3",
    "doc8>=2.0,<3",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"


[tool.nitpick]
style = "https://raw.githubusercontent.com/wemake-services/wemake-python-styleguide/master/styles/nitpick-style-wemake.toml"

[tool.mypy]
disallow_untyped_defs = false
check_untyped_defs = true

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "docs",
    "scripts",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 120

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",  # PEP8 naming convetions
    "D"  # pydocstyle
]
ignore = [
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "D401"  # imperative mood
]

[tool.ruff.lint.pydocstyle]
convention = "google"
