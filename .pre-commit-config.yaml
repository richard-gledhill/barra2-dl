exclude: ^\.idea/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ruff-pre-commit hooks land in Phase 3 of the module structure refactor,
  # once flake8/wemake-python-styleguide/nitpick are replaced by ruff.
