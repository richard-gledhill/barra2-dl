name: Generate Changelog

# Run on demand before cutting a release (Actions tab -> Generate Changelog -> Run workflow).
# It opens a PR rather than pushing to main, because main requires the ci-ok check.
# A PR opened with the default GITHUB_TOKEN does not trigger CI. Either add a CHANGELOG_TOKEN secret (a PAT or
# GitHub App token with contents and pull-requests write), or close and reopen the PR to run the checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    name: Generate Changelog and open PR
    permissions:
      contents: write # push the docs/changelog branch
      pull-requests: write # open the PR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate Changelog
        uses: smichard/conventional_changelog@2.0.11
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or update the changelog PR
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: docs/changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes."
            exit 0
          fi
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git checkout -B "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs: :robot: changelog file generated"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs: update changelog" \
              --body "Generated by the Generate Changelog workflow. Merge before cutting the release."
          fi
