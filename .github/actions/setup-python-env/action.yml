name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.12"
  uv-version:
    description: "uv version to use"
    required: true
    default: "0.11.32"
  no-group:
    description: "Dependency group to leave out, e.g. docs (default: install all default groups)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    # Override .python-version so every later uv command in the job uses the requested interpreter.
    - name: Point uv at the requested Python
      run: echo "UV_PYTHON=${{ inputs.python-version }}" >> "$GITHUB_ENV"
      shell: bash

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: 'true'
        cache-suffix: ${{ inputs.python-version }}

    # Set as an env var, not a sync flag, so later `uv run` calls don't add the group back.
    - name: Leave out a dependency group
      if: inputs.no-group != ''
      run: echo "UV_NO_GROUP=${{ inputs.no-group }}" >> "$GITHUB_ENV"
      shell: bash

    - name: Install Python dependencies
      run: uv sync --frozen
      shell: bash
